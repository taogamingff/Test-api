<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>FFVN.TGM IMAGE API</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;

  background:
    radial-gradient(
      circle at top,
      #ff7900,
      transparent 40%
    ),
    #080808;

  color: white;

  font-family:
    Arial,
    sans-serif;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 20px 0 5px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  border-radius: 20px;

  padding: 20px;

  backdrop-filter: blur(15px);
}

.select {
  display: block;

  border:
    2px dashed
    #ff7900;

  border-radius: 15px;

  padding: 25px;

  text-align: center;

  cursor: pointer;
}

.select input {
  display: none;
}

.preview {
  display: none;

  width: 100%;

  max-height: 400px;

  object-fit: contain;

  margin-top: 20px;

  border-radius: 15px;

  background: #111;
}

.filename {
  display: none;

  margin-top: 15px;

  padding: 12px;

  background: #111;

  border-radius: 10px;

  word-break: break-all;

  color: #ff9a3c;
}

button {
  width: 100%;

  padding: 15px;

  margin-top: 15px;

  border: 0;

  border-radius: 12px;

  font-size: 16px;

  font-weight: bold;
}

.upload {
  background: #ff7900;

  color: white;
}

.upload:disabled {
  opacity: .5;
}

.status {
  text-align: center;

  margin-top: 15px;

  color: #aaa;

  word-break: break-word;
}

.result {
  display: none;

  margin-top: 20px;
}

.resultTitle {
  font-weight: bold;

  margin-top: 15px;

  margin-bottom: 8px;
}

.urlBox {
  background: #050505;

  border:
    1px solid
    #333;

  border-radius: 10px;

  padding: 12px;

  word-break: break-all;

  color: #5cff83;

  font-size: 13px;
}

.copy {
  background: #222;

  color: white;
}

.open {
  display: block;

  text-align: center;

  margin-top: 10px;

  padding: 14px;

  border-radius: 10px;

  background: #333;

  color: white;

  text-decoration: none;
}

.error {
  color: #ff5555;
}

.success {
  color: #55ff88;
}

</style>

</head>

<body>

<div class="container">

<h1>🔥 FFVN.TGM IMAGE API</h1>

<div class="subtitle">
Upload ảnh từ Album → tạo URL
</div>

<div class="card">

<label class="select">

📱

<br><br>

<strong>
CHỌN ẢNH TỪ ALBUM
</strong>

<br><br>

<small>
JPG • PNG • WEBP
</small>

<input
  id="file"
  type="file"
  accept="image/*"
>

</label>

<img
  id="preview"
  class="preview"
>

<div
  id="filename"
  class="filename">
</div>

<button
  id="upload"
  class="upload"
  disabled
>
⬆️ UPLOAD ẢNH
</button>

<div
  id="status"
  class="status"
>
Chưa chọn ảnh
</div>

<div
  id="result"
  class="result"
>

<div class="resultTitle">
🆔 ID ẢNH
</div>

<div
  id="idUrl"
  class="urlBox">
</div>

<div class="resultTitle">
🔗 API URL
</div>

<div
  id="apiUrl"
  class="urlBox">
</div>

<button
  id="copyApi"
  class="copy"
>
📋 COPY API URL
</button>

<div class="resultTitle">
🖼️ IMAGE URL
</div>

<div
  id="imageUrl"
  class="urlBox">
</div>

<button
  id="copyImage"
  class="copy"
>
📋 COPY IMAGE URL
</button>

<a
  id="openImage"
  class="open"
  target="_blank"
>
👁️ MỞ ẢNH
</a>

</div>

</div>

</div>

<script>

const fileInput =
  document.getElementById("file");

const preview =
  document.getElementById("preview");

const filename =
  document.getElementById("filename");

const uploadButton =
  document.getElementById("upload");

const status =
  document.getElementById("status");

const result =
  document.getElementById("result");

const idUrl =
  document.getElementById("idUrl");

const apiUrl =
  document.getElementById("apiUrl");

const imageUrl =
  document.getElementById("imageUrl");

const copyApi =
  document.getElementById("copyApi");

const copyImage =
  document.getElementById("copyImage");

const openImage =
  document.getElementById("openImage");

let selectedFile = null;


/*
 * CHỌN ẢNH
 */

fileInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) return;

    selectedFile = file;

    filename.style.display =
      "block";

    filename.textContent =
      "ID ảnh: " + file.name;

    preview.src =
      URL.createObjectURL(file);

    preview.style.display =
      "block";

    uploadButton.disabled =
      false;

    result.style.display =
      "none";

    status.textContent =
      "Đã chọn ảnh: " +
      file.name;

    status.className =
      "status";

  }
);


/*
 * ĐỌC ẢNH
 */

function readFile(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(
        file
      );

    }
  );

}


/*
 * UPLOAD
 */

uploadButton.addEventListener(
  "click",
  async function () {

    if (!selectedFile) {

      return;

    }

    uploadButton.disabled =
      true;

    status.textContent =
      "⏳ Đang upload ảnh...";

    status.className =
      "status";

    result.style.display =
      "none";

    try {

      const data =
        await readFile(
          selectedFile
        );

      const response =
        await fetch(
          "/api/upload",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                filename:
                  selectedFile.name,

                data: data

              })

          }
        );


      /*
       * Đọc JSON kể cả khi API lỗi
       */

      const text =
        await response.text();

      let json;

      try {

        json =
          JSON.parse(text);

      } catch {

        throw new Error(
          "API không trả về JSON. HTTP " +
          response.status +
          ": " +
          text.substring(0,300)
        );

      }


      if (!response.ok ||
          !json.success) {

        throw new Error(
          json.message ||
          json.error ||
          "Upload thất bại"
        );

      }


      /*
       * HIỂN THỊ KẾT QUẢ
       */

      result.style.display =
        "block";

      idUrl.textContent =
        json.id;

      apiUrl.textContent =
        json.apiUrl;

      imageUrl.textContent =
        json.imageUrl;

      openImage.href =
        json.imageUrl;

      status.textContent =
        "✅ Upload thành công!";

      status.className =
        "status success";


    } catch (error) {

      console.error(error);

      status.textContent =
        "❌ " + error.message;

      status.className =
        "status error";

    }


    uploadButton.disabled =
      false;

  }
);


/*
 * COPY
 */

async function copyText(
  text,
  button
) {

  try {

    await navigator.clipboard.writeText(
      text
    );

    const old =
      button.textContent;

    button.textContent =
      "✅ ĐÃ COPY";

    setTimeout(
      () => {
        button.textContent =
          old;
      },
      1500
    );

  } catch {

    alert(text);

  }

}


copyApi.addEventListener(
  "click",
  () => {

    copyText(
      apiUrl.textContent,
      copyApi
    );

  }
);


copyImage.addEventListener(
  "click",
  () => {

    copyText(
      imageUrl.textContent,
      copyImage
    );

  }
);

</script>

</body>
</html>
