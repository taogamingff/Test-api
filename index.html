<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<title>FFVN.TGM IMAGE API 🔥</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  min-height:100vh;

  background:
    radial-gradient(
      circle at top,
      #252525,
      #0b0b0b 55%,
      #030303
    );

  color:#fff;

  font-family:
    Arial,
    sans-serif;

  padding:16px;

}

.container{

  width:100%;
  max-width:650px;
  margin:auto;

}

.header{

  text-align:center;
  margin:10px 0 20px;

}

.header h1{

  font-size:26px;

  color:#ff7a00;

  font-weight:900;

}

.header p{

  margin-top:7px;

  color:#999;

  font-size:13px;

}

.card{

  background:
    rgba(255,255,255,.06);

  border:
    1px solid rgba(255,255,255,.1);

  border-radius:20px;

  padding:18px;

  margin-bottom:16px;

  backdrop-filter:
    blur(15px);

}

.upload{

  display:block;

  border:
    2px dashed
    rgba(255,122,0,.5);

  border-radius:18px;

  padding:35px 15px;

  text-align:center;

  cursor:pointer;

}

.upload:active{

  transform:scale(.99);

}

.upload-icon{

  font-size:48px;

  margin-bottom:10px;

}

.upload-title{

  font-size:18px;

  font-weight:bold;

}

.upload-text{

  color:#888;

  font-size:13px;

  margin-top:7px;

}

input[type=file]{

  display:none;

}

.preview{

  display:none;

  margin-top:18px;

}

.preview img{

  width:100%;

  max-height:400px;

  object-fit:contain;

  border-radius:15px;

  background:#000;

}

button{

  width:100%;

  border:0;

  border-radius:12px;

  padding:14px;

  margin-top:12px;

  font-size:15px;

  font-weight:800;

  cursor:pointer;

}

.upload-btn{

  background:
    linear-gradient(
      135deg,
      #ff9800,
      #ff5500
    );

  color:#fff;

}

.upload-btn:disabled{

  opacity:.5;

}

.secondary{

  background:#222;

  color:#fff;

}

.status{

  display:none;

  margin-top:14px;

  padding:13px;

  border-radius:11px;

  font-size:13px;

  line-height:1.5;

}

.status.loading{

  display:block;

  color:#ffbd68;

  background:
    rgba(255,150,0,.1);

}

.status.success{

  display:block;

  color:#67e6a0;

  background:
    rgba(0,200,100,.1);

}

.status.error{

  display:block;

  color:#ff7777;

  background:
    rgba(255,0,0,.1);

}

.result{

  display:none;

}

.label{

  font-size:11px;

  color:#888;

  margin-top:14px;

  margin-bottom:5px;

}

.value{

  background:#070707;

  border:
    1px solid #222;

  border-radius:10px;

  padding:11px;

  font-size:12px;

  line-height:1.5;

  word-break:break-all;

}

.green{

  color:#69e6a0;

}

.open{

  background:#ff6d00;

  color:#fff;

}

.copy{

  background:#202020;

  color:#fff;

  font-size:13px;

  padding:10px;

}

.info{

  font-size:12px;

  color:#888;

  line-height:1.8;

}

.info b{

  color:#ddd;

}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>🔥 FFVN.TGM IMAGE API</h1>

<p>
Upload ảnh từ Album và tạo URL tự động
</p>

</div>


<div class="card">


<label
  class="upload"
  for="imageInput"
>

<div class="upload-icon">
🖼️
</div>

<div class="upload-title">
CHỌN ẢNH TỪ ALBUM
</div>

<div class="upload-text">
Android • iPhone • Máy tính
</div>

</label>


<input
  id="imageInput"
  type="file"
  accept="image/*"
>


<div
  class="preview"
  id="preview"
>

<img
  id="previewImage"
  alt="Preview"
>


<button
  class="upload-btn"
  id="uploadBtn"
>

🚀 TẠO URL ẢNH

</button>

</div>


<div
  id="status"
  class="status"
></div>


</div>


<div
  class="card result"
  id="result"
>


<div
  class="green"
  style="
    font-size:18px;
    font-weight:bold;
  "
>

✅ UPLOAD THÀNH CÔNG

</div>


<div class="label">
TÊN FILE
</div>

<div
  class="value"
  id="filename"
>
images.png
</div>


<div class="label">
URL ẢNH TRỰC TIẾP
</div>

<div
  class="value"
  id="imageUrl"
></div>


<button
  class="copy"
  onclick="copyValue('imageUrl')"
>

📋 SAO CHÉP URL ẢNH

</button>


<button
  class="open"
  onclick="openImage()"
>

🖼️ MỞ ẢNH

</button>


<div class="label">
API XEM ẢNH
</div>

<div
  class="value"
  id="apiUrl"
></div>


<button
  class="copy"
  onclick="copyValue('apiUrl')"
>

📋 SAO CHÉP API

</button>


<button
  class="open"
  onclick="openApi()"
>

🔗 MỞ API

</button>


</div>


<div class="card">

<div class="info">

<b>📌 Hệ thống</b>

<br>

Ảnh được lưu vào Vercel Blob Store
<strong>test-api-blob</strong>.

<br>

Tên file tự động:

<b>images.png</b>

<br>

Mỗi lần upload ảnh mới sẽ cập nhật
ảnh hiện tại.

<br>

API xem ảnh:

<b>/api/image</b>

</div>

</div>


</div>


<script>


const input =
  document.getElementById(
    "imageInput"
  );


const preview =
  document.getElementById(
    "preview"
  );


const previewImage =
  document.getElementById(
    "previewImage"
  );


const uploadBtn =
  document.getElementById(
    "uploadBtn"
  );


const statusBox =
  document.getElementById(
    "status"
  );


const result =
  document.getElementById(
    "result"
  );


let selectedFile =
  null;


let imageURL =
  "";


let apiURL =
  "";


/*
================================
CHỌN ẢNH
================================
*/

input.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      showStatus(
        "❌ File không phải ảnh.",
        "error"
      );

      return;

    }


    selectedFile =
      file;


    preview.style.display =
      "block";


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        previewImage.src =
          e.target.result;

      };


    reader.readAsDataURL(
      file
    );


    result.style.display =
      "none";

  }
);


/*
================================
UPLOAD
================================
*/

uploadBtn.addEventListener(
  "click",
  async function(){

    if(!selectedFile){

      return;

    }


    uploadBtn.disabled =
      true;


    uploadBtn.textContent =
      "⏳ ĐANG UPLOAD...";


    showStatus(
      "⏳ Đang tải ảnh lên Vercel Blob...",
      "loading"
    );


    try{


      const formData =
        new FormData();


      formData.append(
        "file",
        selectedFile
      );


      const response =
        await fetch(
          "/api/upload",
          {
            method:"POST",
            body:formData
          }
        );


      const data =
        await response.json();


      if(
        !response.ok ||
        !data.success
      ){

        throw new Error(
          data.message ||
          data.error ||
          "Upload thất bại."
        );

      }


      /*
      ============================
      NHẬN URL
      ============================
      */

      imageURL =
        data.imageUrl;


      apiURL =
        data.apiUrl;


      document.getElementById(
        "filename"
      ).textContent =
        data.filename ||
        "images.png";


      document.getElementById(
        "imageUrl"
      ).textContent =
        imageURL;


      document.getElementById(
        "apiUrl"
      ).textContent =
        apiURL;


      result.style.display =
        "block";


      showStatus(
        "✅ Upload thành công! Đã tạo images.png.",
        "success"
      );


      setTimeout(
        function(){

          result.scrollIntoView({
            behavior:"smooth"
          });

        },
        150
      );


    }catch(error){

      console.error(
        error
      );


      showStatus(
        "❌ " +
        error.message,
        "error"
      );

    }


    uploadBtn.disabled =
      false;


    uploadBtn.textContent =
      "🚀 TẠO URL ẢNH";

  }
);


/*
================================
STATUS
================================
*/

function showStatus(
  message,
  type
){

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

}


/*
================================
COPY
================================
*/

async function copyValue(
  id
){

  const value =
    document.getElementById(
      id
    ).textContent;


  try{

    await navigator.clipboard
      .writeText(value);


    showStatus(
      "✅ Đã sao chép.",
      "success"
    );


  }catch{

    showStatus(
      "❌ Không thể sao chép.",
      "error"
    );

  }

}


/*
================================
MỞ URL ẢNH
================================
*/

function openImage(){

  if(imageURL){

    window.open(
      imageURL,
      "_blank"
    );

  }

}


/*
================================
MỞ API
================================
*/

function openApi(){

  if(apiURL){

    window.open(
      apiURL,
      "_blank"
    );

  }

}

</script>


</body>

</html>
