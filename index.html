<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>FFVN.TGM Image API</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px;

  font-family:
    Arial,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at top,
      #ff7900 0,
      transparent 35%
    ),
    #080808;
}

.container {
  width: 100%;
  max-width: 600px;
  margin: auto;
}

.logo {
  text-align: center;

  font-size: 28px;

  font-weight: 900;

  margin-top: 20px;
}

.subtitle {
  text-align: center;

  color: #aaa;

  margin:
    8px 0 25px;
}

.card {
  padding: 20px;

  border-radius: 22px;

  background:
    rgba(255,255,255,.08);

  border:
    1px solid
    rgba(255,255,255,.12);

  backdrop-filter:
    blur(15px);
}

.pick {
  display: block;

  padding: 28px 15px;

  text-align: center;

  border:
    2px dashed
    #ff7900;

  border-radius: 16px;

  background:
    rgba(255,121,0,.08);

  cursor: pointer;
}

.pick input {
  display: none;
}

.preview {
  display: none;

  width: 100%;

  max-height: 400px;

  object-fit: contain;

  margin-top: 20px;

  border-radius: 15px;

  background: #111;
}

.filename {
  display: none;

  margin-top: 15px;

  padding: 13px;

  background: #111;

  border-radius: 10px;

  color: #ff9a3c;

  word-break: break-all;
}

button {
  width: 100%;

  padding: 15px;

  margin-top: 15px;

  border: 0;

  border-radius: 12px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.upload {
  color: white;

  background: #ff7900;
}

.upload:disabled {
  opacity: .45;

  cursor: not-allowed;
}

.status {
  text-align: center;

  margin-top: 15px;

  color: #aaa;

  word-break: break-word;
}

.success {
  color: #55ff88;
}

.error {
  color: #ff5555;
}

.result {
  display: none;

  margin-top: 25px;
}

.title {
  margin-top: 15px;

  margin-bottom: 7px;

  font-weight: bold;
}

.box {
  padding: 13px;

  border-radius: 10px;

  background: #050505;

  border:
    1px solid #292929;

  color: #64ff8a;

  font-size: 13px;

  word-break: break-all;
}

.copy {
  background: #222;

  color: white;
}

.open {
  display: block;

  padding: 14px;

  margin-top: 10px;

  border-radius: 10px;

  background: #333;

  color: white;

  text-align: center;

  text-decoration: none;
}

.test {
  margin-top: 20px;

  padding: 15px;

  border-radius: 12px;

  background: #111;

  color: #aaa;

  font-size: 13px;

  word-break: break-all;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
🔥 FFVN.TGM IMAGE API
</div>

<div class="subtitle">
Upload ảnh từ Album → tạo URL ảnh
</div>

<div class="card">

<label class="pick">

📱

<br><br>

<strong>
CHỌN ẢNH TỪ ALBUM
</strong>

<br><br>

<small>
JPG • PNG • WEBP • GIF
</small>

<input
  id="file"
  type="file"
  accept="image/*"
>

</label>

<img
  id="preview"
  class="preview"
>

<div
  id="filename"
  class="filename"
></div>

<button
  id="upload"
  class="upload"
  disabled
>
⬆️ UPLOAD ẢNH
</button>

<div
  id="status"
  class="status"
>
Chưa chọn ảnh
</div>

<div
  id="result"
  class="result"
>

<div class="title">
🆔 ID ẢNH
</div>

<div
  id="id"
  class="box"
></div>

<div class="title">
🔗 API URL
</div>

<div
  id="api"
  class="box"
></div>

<button
  id="copyApi"
  class="copy"
>
📋 COPY API URL
</button>

<div class="title">
🖼️ IMAGE URL
</div>

<div
  id="image"
  class="box"
></div>

<button
  id="copyImage"
  class="copy"
>
📋 COPY IMAGE URL
</button>

<a
  id="open"
  class="open"
  target="_blank"
>
👁️ MỞ ẢNH
</a>

</div>

<div class="test">

API kiểm tra:

<br><br>

<span id="testUrl">
Đang kiểm tra...
</span>

</div>

</div>

</div>

<script>

const fileInput =
  document.getElementById("file");

const preview =
  document.getElementById("preview");

const filenameBox =
  document.getElementById("filename");

const uploadButton =
  document.getElementById("upload");

const statusBox =
  document.getElementById("status");

const result =
  document.getElementById("result");

const idBox =
  document.getElementById("id");

const apiBox =
  document.getElementById("api");

const imageBox =
  document.getElementById("image");

const openButton =
  document.getElementById("open");

const copyApi =
  document.getElementById("copyApi");

const copyImage =
  document.getElementById("copyImage");

const testUrl =
  document.getElementById("testUrl");

let selectedFile = null;


/*
 * API URL
 */

const API_URL =
  window.location.origin +
  "/api/upload";

testUrl.textContent =
  API_URL;


/*
 * TEST API
 */

fetch(API_URL)
  .then(async response => {

    const text =
      await response.text();

    try {

      const data =
        JSON.parse(text);

      if (data.success) {

        testUrl.textContent =
          "✅ API ONLINE • " +
          data.blob;

      } else {

        testUrl.textContent =
          "❌ " +
          (data.message ||
           "API lỗi");

      }

    } catch {

      testUrl.textContent =
        "❌ API không trả JSON";

    }

  })
  .catch(error => {

    testUrl.textContent =
      "❌ Không kết nối được API";

  });


/*
 * CHỌN ẢNH
 */

fileInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) return;

    selectedFile = file;

    preview.src =
      URL.createObjectURL(
        file
      );

    preview.style.display =
      "block";

    filenameBox.style.display =
      "block";

    filenameBox.textContent =
      "🆔 ID: " +
      file.name;

    uploadButton.disabled =
      false;

    result.style.display =
      "none";

    statusBox.textContent =
      "Đã chọn: " +
      file.name;

    statusBox.className =
      "status";
  }
);


/*
 * UPLOAD
 */

uploadButton.addEventListener(
  "click",
  async function () {

    if (!selectedFile) return;

    uploadButton.disabled =
      true;

    statusBox.textContent =
      "⏳ Đang upload...";

    statusBox.className =
      "status";

    result.style.display =
      "none";

    try {

      const formData =
        new FormData();

      formData.append(
        "file",
        selectedFile
      );

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",
            body: formData
          }
        );

      const text =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(text);

      } catch {

        throw new Error(
          "API không trả JSON. HTTP " +
          response.status +
          ": " +
          text.substring(0, 300)
        );

      }

      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.message ||
          data.error ||
          "Upload thất bại"
        );

      }


      /*
       * HIỆN KẾT QUẢ
       */

      result.style.display =
        "block";

      idBox.textContent =
        data.id;

      apiBox.textContent =
        data.apiUrl;

      imageBox.textContent =
        data.imageUrl;

      openButton.href =
        data.imageUrl;

      statusBox.textContent =
        "✅ UPLOAD THÀNH CÔNG!";

      statusBox.className =
        "status success";


    } catch (error) {

      console.error(
        error
      );

      statusBox.textContent =
        "❌ " +
        error.message;

      statusBox.className =
        "status error";

    }

    uploadButton.disabled =
      false;

  }
);


/*
 * COPY
 */

async function copy(
  value,
  button
) {

  if (!value) return;

  try {

    await navigator.clipboard.writeText(
      value
    );

    const old =
      button.textContent;

    button.textContent =
      "✅ ĐÃ COPY";

    setTimeout(
      () => {
        button.textContent =
          old;
      },
      1500
    );

  } catch {

    alert(value);

  }
}

copyApi.addEventListener(
  "click",
  () => copy(
    apiBox.textContent,
    copyApi
  )
);

copyImage.addEventListener(
  "click",
  () => copy(
    imageBox.textContent,
    copyImage
  )
);

</script>

</body>
  </html>
