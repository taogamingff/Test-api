<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FFVN.TGM IMAGE API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2b1805, transparent 40%),
        #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,140,0,.25);
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      backdrop-filter: blur(15px);
    }

    h1 {
      text-align: center;
      color: #ff8a00;
      margin: 0 0 8px;
      font-size: 25px;
    }

    .sub {
      text-align: center;
      color: #aaa;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .upload {
      display: block;
      width: 100%;
      padding: 25px 15px;
      text-align: center;
      border: 2px dashed rgba(255,140,0,.55);
      border-radius: 18px;
      cursor: pointer;
      background: rgba(255,140,0,.05);
    }

    .upload strong {
      display: block;
      font-size: 17px;
      margin-bottom: 7px;
    }

    input {
      display: none;
    }

    .preview {
      display: none;
      width: 100%;
      margin-top: 18px;
      border-radius: 15px;
      max-height: 350px;
      object-fit: contain;
      background: #000;
    }

    .progress-wrap {
      display: none;
      margin-top: 18px;
    }

    .progress {
      width: 100%;
      height: 10px;
      border-radius: 20px;
      background: #222;
      overflow: hidden;
    }

    .bar {
      width: 0%;
      height: 100%;
      background: #ff8a00;
      transition: width .15s;
    }

    .percent {
      text-align: center;
      margin-top: 8px;
      color: #ffb15c;
    }

    .result {
      display: none;
      margin-top: 18px;
    }

    .result input {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #151515;
      color: white;
      font-size: 13px;
    }

    .copy {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #ff7a00;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }

    .error {
      color: #ff5c5c;
    }

    .success {
      color: #67e88b;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>FFVN.TGM IMAGE API</h1>

  <div class="sub">
    Upload ảnh từ điện thoại → Vercel Blob → URL trực tiếp
  </div>

  <label class="upload">
    <strong>📷 CHỌN ẢNH TỪ ALBUM</strong>
    <span>Nhấn vào đây để chọn ảnh</span>

    <input
      id="file"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
    >
  </label>

  <img id="preview" class="preview">

  <div id="progressWrap" class="progress-wrap">
    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <div id="percent" class="percent">
      0%
    </div>
  </div>

  <div id="status" class="status"></div>

  <div id="result" class="result">

    <input
      id="url"
      type="text"
      readonly
    >

    <button id="copy" class="copy">
      📋 SAO CHÉP URL ẢNH
    </button>

  </div>

</div>

<script type="module">

import { upload } from "https://esm.sh/@vercel/blob@2.4.0/client";

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const progressWrap = document.getElementById("progressWrap");
const bar = document.getElementById("bar");
const percent = document.getElementById("percent");
const status = document.getElementById("status");
const result = document.getElementById("result");
const urlInput = document.getElementById("url");
const copyButton = document.getElementById("copy");

fileInput.addEventListener("change", async () => {

  const file = fileInput.files?.[0];

  if (!file) return;

  result.style.display = "none";
  status.className = "status";

  if (!file.type.startsWith("image/")) {
    status.textContent = "❌ Chỉ được chọn file ảnh.";
    status.classList.add("error");
    return;
  }

  const maxSize = 4 * 1024 * 1024;

  if (file.size > maxSize) {
    status.textContent =
      "❌ Ảnh quá lớn. Vui lòng chọn ảnh dưới 4 MB.";
    status.classList.add("error");
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";

  progressWrap.style.display = "block";

  bar.style.width = "0%";
  percent.textContent = "0%";

  status.textContent = "⏳ Đang tải ảnh lên...";

  try {

    /*
      Luôn dùng tên images.png.
      Blob không thêm hậu tố ngẫu nhiên.
    */

    const blob = await upload(
      "images.png",
      file,
      {
        access: "public",

        handleUploadUrl: "/api/upload",

        addRandomSuffix: false,

        onUploadProgress(event) {

          const p = Math.round(event.percentage);

          bar.style.width = p + "%";
          percent.textContent = p + "%";
        }
      }
    );

    bar.style.width = "100%";
    percent.textContent = "100%";

    urlInput.value = blob.url;

    result.style.display = "block";

    status.textContent = "✅ Upload thành công!";
    status.classList.add("success");

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Upload lỗi: " +
      (error?.message || "Không xác định");

    status.classList.add("error");

  }

});


copyButton.addEventListener("click", async () => {

  const url = urlInput.value;

  if (!url) return;

  try {

    await navigator.clipboard.writeText(url);

    copyButton.textContent = "✅ ĐÃ SAO CHÉP";

    setTimeout(() => {
      copyButton.textContent = "📋 SAO CHÉP URL ẢNH";
    }, 1500);

  } catch {

    urlInput.select();
    document.execCommand("copy");

  }

});

</script>

</body>
</html>
